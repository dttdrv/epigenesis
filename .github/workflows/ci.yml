name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compiler-only boundary
        run: python tests/verify.py boundary

  windows-smoke:
    name: Windows byte and publication smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Binary ingress and native publication
        run: python -m unittest tests.test_io tests.test_publish.NativeDirectoryPublicationTests -v

  release-gates:
    name: Epigenesis 1.5 release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Source causality and contract attacks
        run: |
          python tests/verify.py source-causality
          python tests/verify.py universal-translation
          python tests/verify.py minimal-example
          python tests/verify.py neural-mechanism-controls
          python tests/verify.py neural-fate-experiment
          python tests/verify.py neural-regulation
          python tests/verify.py neural-construction
          python tests/verify.py coding-consequences
          python tests/verify.py neural-binding
          python tests/verify.py contract-attacks
          python tests/verify.py resource-path-safety
      - name: Installed real-DNA compilation and replay
        env:
          PIP_NO_INDEX: "1"
        run: python tests/verify.py development-real-dna
      - name: Installed wheel smoke test
        env:
          PIP_NO_INDEX: "1"
        run: python tests/verify.py wheel
      - name: Source archive self-test
        env:
          PIP_NO_INDEX: "1"
        run: python tests/verify.py sdist
