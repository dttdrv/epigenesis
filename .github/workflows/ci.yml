name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compiler-only boundary
        run: python tests/verify.py boundary

  release-gates:
    name: Compiler 1.0 release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Source causality and contract attacks
        run: |
          python tests/verify.py source-causality
          python tests/verify.py contract-attacks
          python tests/verify.py resource-path-safety
      - name: Installed real-DNA compilation and replay
        env:
          PIP_NO_INDEX: "1"
        run: python tests/verify.py development-real-dna
      - name: Installed wheel smoke test
        env:
          PIP_NO_INDEX: "1"
        run: python tests/verify.py wheel
      - name: Source archive self-test
        env:
          PIP_NO_INDEX: "1"
        run: python tests/verify.py sdist
