[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epigenesis-studio"
version = "0.4.0"
description = "Local workbench and HelixLoop v4 regulatory variant engine for Epigenesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "epigenesis-compiler>=1.7"]
license = "Apache-2.0"
keywords = ["genomics", "mpra", "enhancers", "variant-effect-prediction", "helixloop", "epigenesis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
helixloop = ["torch>=2.2"]
benchmarks = [
  "torch>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "safetensors>=0.4",
  "huggingface-hub>=0.23",
  "matplotlib>=3.8",
  "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/dttdrv/epigenesis"
Repository = "https://github.com/dttdrv/epigenesis"
Issues = "https://github.com/dttdrv/epigenesis/issues"

[project.scripts]
epigenesis-studio = "epigenesis_studio.server:main"

[tool.setuptools]
packages = ["epigenesis_studio"]

[tool.setuptools.package-data]
epigenesis_studio = ["index.html", "example-edits.json", "model/*"]
