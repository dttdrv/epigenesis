[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epigenesis-studio"
version = "0.1.0"
description = "Local app and command for scoring DNA edits with the Epigenesis predictor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "epigenesis-compiler>=1.6"]
license = "Apache-2.0"

[project.scripts]
epigenesis-studio = "epigenesis_studio.server:main"

[tool.setuptools]
packages = ["epigenesis_studio"]

[tool.setuptools.package-data]
epigenesis_studio = ["index.html", "example-edits.json", "model/*"]
