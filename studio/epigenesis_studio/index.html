<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epigenesis Studio</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f2f2ef; --panel: #ffffff; --field: #f8f8f6;
  --text: #15171a; --text2: #5a6068; --text3: #868c95;
  --tint: rgba(21,23,26,.055); --tint2: rgba(21,23,26,.095); --line: rgba(21,23,26,.10); --line2: rgba(21,23,26,.2); --axis: #d6d5d0;
  --ink: #15171a; --ink-text: #ffffff;
  --pos: #e8670f; --neg: #2f6fdb; --zero: #ebeae6; --pos-text: #b84c06; --neg-text: #1f58bd;
  --pos-bg: rgba(232,103,15,.12); --neg-bg: rgba(47,111,219,.12);
  --ok: #12804a; --ok-bg: rgba(18,128,74,.10); --bad: #c8321f; --bad-bg: rgba(200,50,31,.09); --focus: #2f6fdb;
  --shadow: 0 1px 2px rgba(21,23,26,.04), 0 14px 34px -22px rgba(21,23,26,.22);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0c0e; --panel: #141518; --field: #0f1012;
    --text: #ececea; --text2: #a2a8b0; --text3: #6c727b;
    --tint: rgba(255,255,255,.06); --tint2: rgba(255,255,255,.10); --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.18); --axis: #34373c;
    --ink: #f1f1ef; --ink-text: #0d0e10;
    --pos: #ff8b3d; --neg: #6ba6ff; --zero: #25272b; --pos-text: #ff9d5c; --neg-text: #82b4ff;
    --pos-bg: rgba(255,139,61,.16); --neg-bg: rgba(107,166,255,.16);
    --ok: #4fd38b; --ok-bg: rgba(79,211,139,.12); --bad: #ff7d6b; --bad-bg: rgba(255,125,107,.12); --focus: #7db1ff;
    --shadow: 0 18px 40px -24px rgba(0,0,0,.8);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; min-width: 1120px; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
h1, h2, p { margin: 0; }
[hidden] { display: none !important; }
.up { color: var(--pos-text); } .down { color: var(--neg-text); }
.mono { font-family: var(--mono); }
.grow { flex: 1; }

.app { display: grid; grid-template-columns: 252px 1fr; height: 100vh; }
.side { display: flex; flex-direction: column; padding: 22px 14px 18px; gap: 26px; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.brand span { display: block; font-size: 12.5px; color: var(--text3); }
nav { display: flex; flex-direction: column; gap: 3px; }
nav button { display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 12px; border: 0; border-radius: 11px; background: none; color: var(--text2); cursor: pointer; text-align: left; font-weight: 500; }
nav button svg { flex: none; opacity: .8; }
nav button:hover { background: var(--tint); color: var(--text); }
nav button[aria-selected=true] { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(21,23,26,.06); }
nav button[aria-selected=true] svg { opacity: 1; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; padding: 0 4px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--tint); }
.seg button { border: 0; background: none; border-radius: 8px; height: 28px; padding: 0 12px; color: var(--text2); cursor: pointer; font-weight: 550; font-size: 13px; }
.seg button[aria-pressed=true] { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(21,23,26,.06); }
.side-foot .seg { align-self: flex-start; }
.proto { font-size: 12.5px; line-height: 1.5; color: var(--text3); }
.proto b { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; color: var(--text2); font-weight: 600; }
.proto b::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pos); }

main { overflow-y: auto; padding: 10px 14px 14px 0; }
.view { min-height: 100%; background: var(--bg); padding: 22px 34px 80px; max-width: 1280px; }
.page { margin-bottom: 22px; }
.page h1 { font-size: 26px; line-height: 1.2; font-weight: 650; letter-spacing: -.022em; }
.page p { margin-top: 6px; font-size: 15px; color: var(--text2); max-width: 70ch; }

.panel { background: var(--panel); border-radius: 18px; padding: 22px 24px; margin-bottom: 16px; box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.panel-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.panel-head h2 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.panel-head .sub { margin-top: 3px; font-size: 13px; color: var(--text2); max-width: 74ch; }
.panel-head .grow { min-width: 0; }
.panel-head .tools { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.meta { font-size: 13px; color: var(--text3); }
.field-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 15px; border: 0; border-radius: 10px; background: var(--tint); color: var(--text); font-weight: 550; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--tint2); }
.btn.primary { background: var(--ink); color: var(--ink-text); }
.btn.primary:hover { opacity: .88; }
.btn:disabled { opacity: .5; cursor: progress; }
.chip { height: 24px; padding: 0 9px; border: 0; border-radius: 7px; background: var(--tint); color: var(--text2); font: 12.5px var(--mono); cursor: pointer; }
.chip:hover { background: var(--tint2); color: var(--text); }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus); }
textarea, input[type=text], input[type=number], select { background: var(--field); border: 0; border-radius: 11px; box-shadow: inset 0 0 0 1px var(--line2); padding: 9px 12px; }
textarea:focus, input:focus, select:focus { outline: none; box-shadow: inset 0 0 0 1px var(--focus), 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
textarea { display: block; width: 100%; font: 13px/1.6 var(--mono); resize: vertical; padding: 14px 16px; }
select { height: 36px; padding: 0 30px 0 12px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text3) 50%), linear-gradient(135deg, var(--text3) 50%, transparent 50%); background-position: calc(100% - 17px) 15px, calc(100% - 12px) 15px; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
input[type=number] { width: 96px; height: 36px; }
input[type=text] { height: 36px; width: 230px; }
.actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.alert { margin-top: 14px; padding: 11px 14px; border-radius: 11px; background: var(--bad-bg); color: var(--bad); font-weight: 500; }

.hint { display: flex; align-items: center; gap: 28px; padding: 6px 4px; color: var(--text2); }
.hint p { max-width: 52ch; font-size: 14px; }
.mini { display: grid; grid-template-columns: repeat(42, 9px); grid-auto-rows: 9px; gap: 2px; flex: none; }
.mini i { border-radius: 2.5px; }
.mini i.ref { display: grid; place-items: center; font: 600 8px var(--mono); font-style: normal; color: var(--text3); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; padding: 10px 6px 26px; }
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .k { font-size: 13px; color: var(--text2); font-weight: 500; }
.stat b { font-size: 34px; line-height: 1.1; font-weight: 650; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 13px; color: var(--text3); height: 24px; display: flex; align-items: center; }
.stat .chip { align-self: flex-start; }

.hm-wrap { position: relative; overflow-x: auto; padding-bottom: 2px; }
canvas { display: block; }
.legend { display: flex; align-items: center; gap: 10px; font-size: 12.5px; white-space: nowrap; margin-top: 3px; }
.legend i { width: 132px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--neg), var(--zero), var(--pos)); }
#tip, #stripTip { position: absolute; pointer-events: none; background: var(--ink); color: var(--ink-text); padding: 5px 9px; border-radius: 8px; font: 12.5px var(--mono); white-space: nowrap; transform: translate(12px, -36px); z-index: 2; }

.detail { display: grid; grid-template-columns: 1.05fr 1.7fr 1.25fr; gap: 40px; align-items: start; }
.d-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text2); }
.d-big { font: 600 30px/1.1 var(--mono); letter-spacing: -.02em; }
.d-num { margin-top: 10px; display: flex; align-items: baseline; gap: 12px; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.d-num span { font-size: 14px; font-weight: 550; }
.seq-row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
.seq-name { width: 78px; flex: none; font-size: 13px; color: var(--text3); }
.seq { font: 15px/1.6 var(--mono); letter-spacing: .09em; white-space: nowrap; }
.seq mark { padding: 2px 6px; border-radius: 7px; background: var(--tint2); color: var(--text); font-weight: 650; }
.seq mark.up { background: var(--pos-bg); color: var(--pos-text); } .seq mark.down { background: var(--neg-bg); color: var(--neg-text); }
.part { display: grid; grid-template-columns: 70px 1fr 62px; gap: 12px; align-items: center; height: 30px; font-size: 13.5px; }
.part span:first-child { color: var(--text2); }
.part b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { color: var(--text3); font-size: 14px; padding: 6px 0; }

.bar { position: relative; height: 8px; min-width: 120px; background: var(--tint); border-radius: 4px; }
.bar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line2); }
.bar b { position: absolute; top: 0; height: 100%; border-radius: 4px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th { padding: 0 12px 10px; text-align: left; font-size: 12.5px; font-weight: 550; color: var(--text3); }
td { height: 42px; padding: 0 12px; vertical-align: middle; font-size: 14px; }
td:first-child, th:first-child { padding-left: 14px; }
tbody td:first-child { border-radius: 10px 0 0 10px; } tbody td:last-child { border-radius: 0 10px 10px 0; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--tint); }
tr.on td { background: var(--tint2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.rank { color: var(--text3); width: 56px; }
td.dir { white-space: nowrap; font-weight: 550; }
.badge { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--ink); color: var(--ink-text); font-size: 12.5px; font-weight: 650; }
.seg-wrap { display: flex; align-items: center; gap: 8px; }
.seg-wrap > span { font-size: 13px; color: var(--text2); }

.options { display: flex; flex-direction: column; gap: 14px; }
.cols { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--text2); }
.cols code { font: 12.5px var(--mono); padding: 3px 8px; border-radius: 7px; background: var(--tint); color: var(--text); }
.cols code.opt { color: var(--text3); }
.two { display: grid; grid-template-columns: 1fr 300px; gap: 28px; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.pick-card { padding: 14px 16px; border-radius: 14px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pick-card .top { display: flex; align-items: center; gap: 8px; }
.pick-card .pc-id { font: 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-card .pc-fam { font-size: 12.5px; color: var(--text3); }
.pick-card .pc-eff { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.strip-wrap { position: relative; }

.drop { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 44px 24px; border-radius: 18px; background: var(--tint); color: var(--text2); text-align: center; transition: background .15s; }
.drop.over { background: var(--tint2); }
.drop b { font-size: 16px; color: var(--text); font-weight: 600; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 22px; }
.step { display: flex; gap: 14px; padding: 4px 6px; }
.step .n { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--panel); box-shadow: 0 0 0 1px var(--line); font-weight: 650; }
.step b { display: block; font-weight: 650; }
.step p { margin-top: 2px; color: var(--text2); font-size: 13.5px; }
.verdict { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 16px; background: var(--ok-bg); }
.verdict.bad { background: var(--bad-bg); }
.verdict .vicon { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--ok); color: var(--ink-text); }
.verdict.bad .vicon { background: var(--bad); color: #fff; }
.verdict b { display: block; font-size: 18px; font-weight: 650; }
.verdict p { margin-top: 1px; color: var(--text2); }
.checks { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-direction: column; gap: 4px; }
.checks li { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 6px; font-weight: 500; }
.checks .dot { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); }
.checks li.fail .dot { background: var(--bad-bg); color: var(--bad); }
.checks li.fail { color: var(--bad); }

dialog { width: min(760px, calc(100% - 64px)); max-height: calc(100vh - 64px); overflow: auto; padding: 30px 32px 28px; border: 0; border-radius: 22px; background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line), 0 40px 90px -24px rgba(0,0,0,.5); }
dialog::backdrop { background: rgba(10,11,13,.38); backdrop-filter: blur(6px); }
dialog .head { display: flex; align-items: center; margin-bottom: 4px; }
.count { margin-left: auto; min-width: 20px; padding: 1px 7px; border-radius: 999px; background: var(--ink); color: var(--ink-text); font-size: 12px; font-weight: 600; text-align: center; }
.files { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
.file { display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 14px; border: 0; border-radius: 11px; background: var(--tint); color: var(--text); cursor: pointer; text-align: left; }
.file:hover { background: var(--tint2); }
.file b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.file .kind { padding: 2px 9px; border-radius: 999px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); font-size: 12.5px; color: var(--text2); }
#dropHint { position: fixed; inset: 14px; z-index: 50; display: grid; place-items: center; border-radius: 22px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(5px); box-shadow: 0 0 0 2px var(--ink); font-size: 20px; font-weight: 600; pointer-events: none; }
#dropHint[hidden] { display: none; }
.nav-cap { padding: 14px 12px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); }
nav .nav-cap:first-child { padding-top: 0; }
dialog h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
dialog h2 { margin: 24px 0 6px; font-size: 14px; font-weight: 650; }
dialog p { color: var(--text2); line-height: 1.55; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.fact { padding: 16px 18px; border-radius: 14px; background: var(--tint); }
.fact b { display: block; font-size: 26px; line-height: 1.15; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.fact b.bad { color: var(--bad); }
.fact p { margin-top: 4px; font-size: 13px; }
.hash { margin-top: 6px; padding: 10px 12px; border-radius: 10px; background: var(--tint); font: 12px/1.5 var(--mono); word-break: break-all; color: var(--text); }
.small { font-size: 12.5px; }
.site { display: grid; grid-template-columns: 1fr 290px; gap: 40px; align-items: start; }
.matrix { display: grid; grid-template-columns: 74px repeat(9, 1fr); gap: 6px; align-items: center; }
.matrix .lab { font-size: 12.5px; color: var(--text3); font-weight: 550; }
.matrix .posn { text-align: center; font: 12px var(--mono); color: var(--text3); }
.sbase { display: grid; place-items: center; height: 42px; border-radius: 11px; font: 650 18px var(--mono); background: var(--tint); color: var(--text); }
.sbase.hit { background: var(--neg-bg); color: var(--neg-text); box-shadow: inset 0 0 0 1.5px var(--neg); }
.cell { display: grid; place-items: center; height: 42px; border: 0; border-radius: 11px; font: 12px var(--mono); color: var(--text); cursor: pointer; }
.cell:hover { box-shadow: 0 0 0 2px var(--line2); }
.cell.on { box-shadow: 0 0 0 2px var(--ink); }
.cell.na { background: repeating-linear-gradient(135deg, var(--tint) 0 6px, transparent 6px 12px); color: var(--text3); cursor: not-allowed; }
.cell.na:hover { box-shadow: none; }
.cell.ref { background: none; color: var(--text3); cursor: default; }
.cell.ref:hover { box-shadow: none; }
.site-side { display: flex; flex-direction: column; gap: 16px; }
.site-side .k { display: block; margin-bottom: 2px; font-size: 13px; font-weight: 600; color: var(--text2); }
.site-side .v { font: 600 20px/1.2 var(--mono); letter-spacing: .06em; }
.site-side .g { font: 12.5px var(--mono); color: var(--text3); letter-spacing: .06em; }
.site-side .q { font-size: 30px; font-weight: 650; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; line-height: 1.5; color: var(--text2); }
.cond { display: grid; grid-template-columns: 1fr 300px; gap: 40px; align-items: start; }
.phase { display: flex; align-items: center; gap: 22px; min-height: 52px; }
.phase .pn { width: 62px; font-weight: 650; }
.phase label { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); }
.phase input[type=number] { width: 84px; }
.phase .sig { flex: 1; }
.phase input[type=range] { flex: 1; min-width: 120px; accent-color: var(--ink); }
.phase .sigv { width: 38px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.btn.icon { width: 32px; padding: 0; height: 32px; font-size: 18px; color: var(--text2); }
.presets { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 13px; color: var(--text2); }
.timeline { display: flex; align-items: flex-end; gap: 3px; height: 74px; }
.timeline .tl { display: flex; align-items: flex-end; min-width: 6px; height: 100%; border-radius: 8px; background: var(--tint); overflow: hidden; }
.timeline .tl i { display: block; width: 100%; background: color-mix(in srgb, var(--ink) 55%, transparent); border-radius: 8px 8px 0 0; }
.adv { margin-top: 14px; }
.adv summary { display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text2); width: max-content; }
.adv summary::-webkit-details-marker { display: none; }
.adv summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--text3); border-bottom: 2px solid var(--text3); transform: rotate(-45deg); transition: transform .15s; }
.adv[open] summary::before { transform: rotate(45deg); }
.initial { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
.initial label { display: flex; align-items: center; gap: 8px; font: 13px var(--mono); color: var(--text2); }
.initial input { width: 76px; }
.flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
.fstep { position: relative; padding: 16px 18px; border-radius: 16px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), var(--shadow); min-width: 0; }
.fstep:not(:last-child)::after { content: ""; position: absolute; right: -12px; top: 50%; width: 8px; height: 8px; border-top: 2px solid var(--text3); border-right: 2px solid var(--text3); transform: translateY(-50%) rotate(45deg); }
.fstep .fk { display: block; font-size: 13px; font-weight: 600; color: var(--text2); }
.fstep .fv { margin-top: 4px; font: 650 21px/1.2 var(--mono); letter-spacing: .02em; }
.fstep .fv.plain { font-family: inherit; letter-spacing: -.01em; }
.fstep .fv mark { padding: 1px 5px; border-radius: 6px; background: var(--neg-bg); color: var(--neg-text); }
.fstep .fs { margin-top: 4px; font-size: 12.5px; color: var(--text3); }
.keys { display: flex; gap: 8px; flex-wrap: wrap; }
.key { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: var(--tint); color: var(--text); font-size: 13px; font-weight: 550; cursor: pointer; }
.key i { width: 14px; height: 4px; border-radius: 2px; background: var(--c); }
.key[aria-pressed=false] { opacity: .45; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 32px; }
.chart .ch-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.chart .ch-head b { font-size: 14px; font-weight: 650; }
.read { display: flex; gap: 12px; font: 12.5px var(--mono); color: var(--text2); }
.read span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: var(--c); }
.chart canvas { cursor: crosshair; }
.two-col { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; align-items: start; }
.two-col .panel { margin-bottom: 0; }
.prov { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-top: 16px; font-size: 12.5px; }
.prov span:nth-child(odd) { color: var(--text3); }
.prov span:nth-child(even) { font-family: var(--mono); color: var(--text2); }
.assume { list-style: none; counter-reset: a; margin: 0; padding: 0; display: grid; gap: 10px; }
.assume li { counter-increment: a; display: flex; gap: 12px; color: var(--text2); line-height: 1.5; }
.assume li::before { content: counter(a); flex: none; display: grid; place-items: center; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; background: var(--tint); color: var(--text2); font-size: 12px; font-weight: 650; }
.scope { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--tint); font-size: 13px; color: var(--text2); }
.read .tm::before { display: none; }
</style>
</head>

let lang = /^bg/i.test(navigator.language) ? 'bg' : 'en';
try { const saved = localStorage.getItem('studio-lang'); if (saved in T) lang = saved; } catch {}
const t = (key, p = {}) => (T[lang][key] ?? T.en[key] ?? key).replace(/\{(\w+)\}/g, (_, n) => p[n] ?? '');

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? node.className = v : node.setAttribute(k, v);
  for (const kid of kids) node.append(kid);
  return node;
}
const say = (node, key, params) => { node.dataset.k = key; params ? node.dataset.p = JSON.stringify(params) : delete node.dataset.p; node.textContent = t(key, params); };
const plain = (node, text) => { delete node.dataset.k; delete node.dataset.p; node.textContent = text; };

function errText(f) {
  if (!f.key) return f.params.msg;
  const p = { ...f.params };
  if ('field' in p) p.where = p.id == null ? t('where.sequence') : t('where.edit', { id: p.id, field: t('field.' + p.field) });
  return t(f.key, p);
}
const showErr = (box, f) => { box._f = f; box.textContent = errText(f); box.hidden = false; };
const clearErr = box => { box._f = null; box.hidden = true; };

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw data.code ? new Fail('err.' + data.code, data.params) : new Fail(null, { msg: data.error || r.statusText });
  return data;
}

async function guarded(button, box, work) {
  clearErr(box); button.disabled = true;
  try { await work(); }
  catch (e) { showErr(box, e instanceof Fail ? e : new Fail(null, { msg: e.message })); }
  finally { button.disabled = false; }
}

function save(name, text, type) {
  const a = el('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove();
}
const csvCell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
const toCsv = (head, rows) => [head, ...rows].map(r => r.map(csvCell).join(',')).join('\n') + '\n';
const csvDirection = e => ({ up: 'increase', down: 'decrease', none: 'none' })[dirOf(e)];
const saveReceipt = r => save(`epigenesis-receipt-${r.receipt_sha256.slice(0, 8)}.json`, JSON.stringify(r, null, 1) + '\n', 'application/json');

function bar(effect, scale) {
  const w = Math.min(1, Math.abs(effect) / scale) * 50, b = el('b');
  b.style.width = w + '%'; b.style.background = effect < 0 ? 'var(--neg)' : 'var(--pos)'; b.style.left = effect < 0 ? (50 - w) + '%' : '50%';
  return el('div', { class: 'bar', 'aria-hidden': 'true' }, b);
}
const dirCell = e => el('td', { class: 'dir ' + dirOf(e) }, ARROW[dirOf(e)] + t('dir.' + dirOf(e)));

// language
function applyLang() {

  document.querySelectorAll('[data-k]').forEach(e => { e.textContent = t(e.dataset.k, e.dataset.p && JSON.parse(e.dataset.p)); });
  document.querySelectorAll('[data-ph]').forEach(e => { e.placeholder = t(e.dataset.ph); });

}

// heat colors
const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const mix = (a, b, f) => a.map((x, i) => Math.round(x + (b[i] - x) * f));
const roundBox = (ctx, x, y, w, h, r) => { ctx.beginPath(); if (ctx.roundRect && r > 0) ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); else ctx.rect(x, y, w, h); };

// simulate
let siteTable = null;
const sim = { protein: 'GLI2', index: null, alt: null, phases: [[20, .2]], initial: {}, hidden: new Set(), cursor: null, result: null, charts: [] };
const PRESETS = { const: [[20, .2]], primed: [[5, 1], [15, .05]], low: [[20, .05]] };
const revComp = s => [...s].reverse().map(c => ({ A: 'T', C: 'G', G: 'C', T: 'A' })[c]).join('');
const fold = q => { const x = 1 / q; return x >= 10 ? String(Math.round(x)) : x.toFixed(1); };
const variantSite = () => sim.index === null ? null : siteTable.consensus.slice(0, sim.index) + sim.alt + siteTable.consensus.slice(sim.index + 1);
const ratioOf = () => sim.index === null ? null : siteTable.proteins[sim.protein][sim.index][sim.alt];

function pickSite(site) {
  const i = [...site].findIndex((b, k) => b !== siteTable.consensus[k]);
  sim.index = i < 0 ? null : i; sim.alt = i < 0 ? null : site[i];
}

function renderSite() {
  if (!siteTable) return;
  const c = siteTable.consensus, rows = siteTable.proteins[sim.protein];
  const label = text => el('span', { class: 'lab' }, text), kids = [el('span'), ...[...c].map((_, i) => el('span', { class: 'posn' }, String(i + 1)))];
  kids.push(label(t('sim.site.ref')), ...[...c].map(b => el('span', { class: 'sbase' }, b)));
  for (const alt of BASES) {
    kids.push(label('→ ' + alt));
    [...c].forEach((base, i) => {
      if (base === alt) return kids.push(el('span', { class: 'cell ref' }, '·'));
      const q = rows[i][alt];
      if (q === null) return kids.push(el('span', { class: 'cell na', title: t('sim.cell.na') }, '–'));
      const cell = el('button', { class: 'cell' + (sim.index === i && sim.alt === alt ? ' on' : ''), type: 'button', title: t('sim.cell.tip', { from: base, pos: i + 1, to: alt, q: q.toPrecision(2) }) }, q.toPrecision(2));
      cell.style.background = `color-mix(in srgb, var(--neg) ${Math.round(14 + Math.min(1, Math.max(0, (-Math.log10(q) - .7) / 2.8)) * 52)}%, var(--tint2))`;
      cell.onclick = () => { sim.index = i; sim.alt = alt; renderSite(); };
      kids.push(cell);
    });
  }
  kids.push(label(t('sim.site.var')), ...[...c].map((b, i) => el('span', { class: 'sbase' + (sim.index === i ? ' hit' : '') }, sim.index === i ? sim.alt : b)));
  $('#siteGrid').replaceChildren(...kids);
  const v = variantSite(), q = ratioOf();
  $('#siteRef').textContent = c; $('#siteRefG').textContent = siteTable.genome_strand;
  $('#siteVar').textContent = v ?? '–'; $('#siteVarG').textContent = v ? revComp(v) : '–';
  $('#siteQ').textContent = q === null ? '–' : '×' + q.toPrecision(2);
  q === null ? say($('#siteQSub'), 'sim.pick') : say($('#siteQSub'), 'sim.weaker', { x: fold(q) });
  document.querySelectorAll('#protSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.prot === sim.protein)));
}
document.querySelectorAll('#protSeg button').forEach(b => b.onclick = () => {
  sim.protein = b.dataset.prot;
  if (sim.index !== null && siteTable.proteins[sim.protein][sim.index][sim.alt] === null) sim.index = sim.alt = null;
  renderSite();
});
$('#usePublished').onclick = () => { sim.protein = siteTable.published.protein; pickSite(siteTable.published.site); renderSite(); };

function renderTimeline() {
  const total = sim.phases.reduce((s, p) => s + (p[0] > 0 ? p[0] : 0), 0);
  $('#timeline').replaceChildren(...sim.phases.map(p => {
    const segment = el('div', { class: 'tl' }), fill = el('i');
    segment.style.flexGrow = p[0] > 0 ? p[0] : 0; fill.style.height = Math.round(Math.min(1, Math.max(0, p[1])) * 100) + '%';
    segment.append(fill); return segment;
  }));
  say($('#tlTotal'), 'sim.total', { n: +total.toFixed(2) });
  document.querySelectorAll('#presetSeg button').forEach(b => b.setAttribute('aria-pressed', String(JSON.stringify(PRESETS[b.dataset.preset]) === JSON.stringify(sim.phases))));
}
function renderPhases() {
  $('#phases').replaceChildren(...sim.phases.map((p, i) => {
    const duration = el('input', { type: 'number', min: '0.1', step: '1', value: String(p[0]), 'aria-label': t('sim.duration') });
    const signal = el('input', { type: 'range', min: '0', max: '1', step: '0.01', value: String(p[1]), 'aria-label': t('sim.signal') });
    const shown = el('b', { class: 'sigv' }, p[1].toFixed(2)), remove = el('button', { class: 'btn icon', type: 'button', title: t('sim.remove'), 'aria-label': t('sim.remove') }, '×');
    duration.oninput = () => { sim.phases[i][0] = duration.valueAsNumber; renderTimeline(); };
    signal.oninput = () => { sim.phases[i][1] = +signal.value; shown.textContent = (+signal.value).toFixed(2); renderTimeline(); };
    remove.disabled = sim.phases.length === 1; remove.onclick = () => { sim.phases.splice(i, 1); renderPhases(); };
    return el('div', { class: 'phase' }, el('span', { class: 'pn' }, t('sim.phase', { n: i + 1 })),
      el('label', {}, t('sim.duration'), duration, el('span', {}, t('sim.units'))), el('label', { class: 'sig' }, t('sim.signal'), signal, shown), remove);
  }));
  $('#addPhase').disabled = !siteTable || sim.phases.length >= siteTable.max_phases;
  renderTimeline();
}
$('#addPhase').onclick = () => { sim.phases.push([10, .2]); renderPhases(); };
document.querySelectorAll('#presetSeg button').forEach(b => b.onclick = () => { sim.phases = PRESETS[b.dataset.preset].map(p => [...p]); renderPhases(); });
function buildInitial() {
  $('#initial').replaceChildren(...siteTable.genes.map(gene => {
    const input = el('input', { type: 'number', min: '0', max: '1', step: '0.05', value: String(sim.initial[gene]), 'aria-label': gene });
    input.oninput = () => { sim.initial[gene] = input.valueAsNumber; };
    return el('label', {}, gene, input);
  }));
}

$('#simRun').onclick = () => guarded($('#simRun'), $('#simErr'), async () => {
  if (sim.index === null) throw new Fail('err.sim_same');
  say($('#simInfo'), 'sim.running');
  try {
    const t0 = performance.now();
    const receipt = await api('/api/score', { mode: 'simulate', site: variantSite(), protein: sim.protein, phases: sim.phases.map(p => [...p]), initial_state: sim.initial });
    sim.result = { receipt, seconds: (performance.now() - t0) / 1000 }; sim.cursor = null; renderSim();
    plain($('#simInfo'), sim.result.seconds.toFixed(1) + ' s');
  } catch (e) { plain($('#simInfo'), ''); throw e; }
});

const SERIES = () => ({ reference: { color: css('--text'), width: 2.4, dash: [] }, reversion: { color: css('--ok'), width: 2.2, dash: [3, 6] },
  variant: { color: css('--pos'), width: 2.4, dash: [] }, reporter: { color: css('--neg'), width: 2.4, dash: [] } });
const CH = { h: 176, l: 38, r: 12, t: 12, b: 26 };

function drawChart(canvas, o) {
  const W = canvas.parentElement.clientWidth;
  if (!W) return;
  const H = o.h ?? CH.h, dpr = window.devicePixelRatio || 1, ctx = canvas.getContext('2d');
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const T = o.time[o.time.length - 1], x = v => CH.l + v / T * (W - CH.l - CH.r), y = v => H - CH.b - v * (H - CH.b - CH.t);
  const t3 = css('--text3'), axis = css('--axis');
  ctx.font = '11.5px ui-monospace, Menlo, monospace'; ctx.fillStyle = t3; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const v of [0, .5, 1]) {
    ctx.strokeStyle = axis; ctx.lineWidth = 1; ctx.setLineDash(v === .5 && o.threshold ? [2, 4] : []); ctx.globalAlpha = v === 0 ? 1 : .55;
    ctx.beginPath(); ctx.moveTo(CH.l, y(v)); ctx.lineTo(W - CH.r, y(v)); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillText(String(v), CH.l - 8, y(v));
  }
  ctx.setLineDash([]); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const step = [1, 2, 5, 10, 20, 25, 50].find(s => T / s <= 8) ?? 100;
  for (let v = 0; v <= T + 1e-9; v += step) ctx.fillText(String(+v.toFixed(2)), x(v), H - CH.b + 8);
  for (const c of o.curves) {
    ctx.beginPath();
    o.time.forEach((time, i) => {
      const px = x(time), py = y(c.values[i]);
      if (!i) ctx.moveTo(px, py); else { if (o.step) ctx.lineTo(px, y(c.values[i - 1])); ctx.lineTo(px, py); }

function prepScan(receipt, seconds) {

    grid[BASES.indexOf(m[3])][pos] = p.effect;

// score edits
function csvRecords(text) {
  const out = []; let row = [], cell = '', quoted = false;
  const sep = text.split('\n', 1)[0].includes('\t') ? '\t' : ',';
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; } else cell += c; }
    else if (c === '"') quoted = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x !== '')) out.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some(x => x !== '')) out.push(row);
  return out;
}

function parseEdits(text) {
  text = text.trim();
  if (!text) throw new Fail('err.no_edits');
  if (text[0] === '[') { try { return JSON.parse(text); } catch { throw new Fail('err.json'); } }
  const [head, ...body] = csvRecords(text), cols = head.map(h => h.trim().toLowerCase());
  for (const need of ['id', 'reference', 'sequence']) if (!cols.includes(need)) throw new Fail('err.csv_need', { c: need });
  for (const c of cols) if (!['id', 'reference', 'sequence', 'family'].includes(c)) throw new Fail('err.csv_unknown', { c });
  return body.map(r => Object.fromEntries(cols.map((c, i) => [c, (r[i] ?? '').trim()]).filter(([c, v]) => c !== 'family' || v !== '')));
}

}

function drawPairs() {
  const q = $('#filter').value.trim().toLowerCase(), LIMIT = 200;
  const all = pairs.rows.filter(r => !q || r.id.toLowerCase().includes(q) || r.family.toLowerCase().includes(q)), shown = all.slice(0, LIMIT);
  $('#pairsRows').replaceChildren(...shown.map(r => el('tr', {},
    el('td', { class: 'num rank' }, String(r.rank)), el('td', { class: 'mono' }, r.id), el('td', { class: 'mono' }, r.family),
    el('td', { class: 'num' }, fmt(r.effect)), el('td', {}, bar(r.effect, pairs.scale)), dirCell(r.effect),
    el('td', {}, pairs.chosen.has(r.id) ? el('span', { class: 'badge' }, String(pairs.chosen.get(r.id))) : ''))));
  $('#more').hidden = all.length <= LIMIT;
  $('#more').textContent = t('pairs.more', { n: LIMIT, m: all.length });
}

const STRIP = { h: 150, pad: 30, top: 18, bottom: 40 };
function drawStrip() {
  const wrap = $('#stripWrap');
  if (!pairs || !wrap.clientWidth) return;
  const W = wrap.clientWidth, H = STRIP.h, dpr = window.devicePixelRatio || 1, cv = $('#strip'), ctx = cv.getContext('2d');
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const m = pairs.scale * 1.1, x = e => STRIP.pad + (e + m) / (2 * m) * (W - 2 * STRIP.pad), band = H - STRIP.top - STRIP.bottom;
  const pos = css('--pos'), neg = css('--neg'), t3 = css('--text3'), ink = css('--text'), axis = css('--axis');
  ctx.strokeStyle = axis; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(STRIP.pad, H - STRIP.bottom + 12); ctx.lineTo(W - STRIP.pad, H - STRIP.bottom + 12); ctx.stroke();
  ctx.strokeStyle = css('--line2'); ctx.beginPath(); ctx.moveTo(x(0), STRIP.top - 4); ctx.lineTo(x(0), H - STRIP.bottom + 18); ctx.stroke();
  ctx.fillStyle = t3; ctx.font = '11.5px ui-monospace, Menlo, monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  for (const v of [-m / 1.1, 0, m / 1.1]) ctx.fillText(v === 0 ? '0' : fmt(v), x(v), H - STRIP.bottom + 22);
  const jitter = i => ((Math.imul(i + 1, 2654435761) >>> 0) % 997) / 997;
  pairs.dots = [];
  const dot = (r, i, radius) => { const px = x(r.effect), py = STRIP.top + jitter(i) * band; pairs.dots.push({ px, py, radius, r }); return [px, py]; };
  ctx.globalAlpha = .62;
  pairs.rows.forEach((r, i) => { if (pairs.chosen.has(r.id)) return; const [px, py] = dot(r, i, 4); ctx.fillStyle = r.effect < 0 ? neg : pos; ctx.beginPath(); ctx.arc(px, py, 4, 0, 6.2832); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.textBaseline = 'middle'; ctx.font = '650 11px -apple-system, system-ui, sans-serif';
  pairs.rows.forEach((r, i) => {
    if (!pairs.chosen.has(r.id)) return;
    const [px, py] = dot(r, i, 10);
    ctx.fillStyle = r.effect < 0 ? neg : pos; ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, 10, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText(String(pairs.chosen.get(r.id)), px, py + .5);
  });
}
const dotAt = ev => {
  const rect = $('#strip').getBoundingClientRect(), x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  let best = null, bd = Infinity;
  for (const d of pairs?.dots || []) { const dist = Math.hypot(d.px - x, d.py - y); if (dist <= Math.max(d.radius, 7) && (dist < bd || d.radius > (best?.radius ?? 0))) { best = d; bd = dist; } }
  return best;
};
$('#strip').onmousemove = ev => {
  const d = dotAt(ev), tip = $('#stripTip');
  $('#strip').style.cursor = d ? 'pointer' : '';
  if (!d) { tip.hidden = true; return; }
  const r = $('#stripWrap').getBoundingClientRect();
  tip.hidden = false; tip.textContent = `${d.r.id}  ${fmt(d.r.effect)}`;
  tip.style.left = (ev.clientX - r.left) + 'px'; tip.style.top = (ev.clientY - r.top) + 'px';
};
$('#strip').onmouseleave = () => { $('#stripTip').hidden = true; };
$('#strip').onclick = ev => { const d = dotAt(ev); if (d) { $('#filter').value = d.r.id; drawPairs(); } };

$('#pairsBtn').onclick = () => guarded($('#pairsBtn'), $('#pairsErr'), async () => {
  const rows = parseEdits($('#edits').value), b = $('#budget').value, request = { mode: 'pairs', rows };
  if (b !== '') request.budget = Number(b);
  const t0 = performance.now(), receipt = await api('/api/score', request);
  pairs = { receipt }; $('#filter').value = ''; renderPairs();
  say($('#pairsInfo'), 'pairs.done', { n: rows.length, s: ((performance.now() - t0) / 1000).toFixed(1) });
});
$('#examplePairs').onclick = async () => {
  $('#edits').value = JSON.stringify(await api('/api/example'), null, 1); $('#budget').value = 3;
  say($('#pairsInfo'), 'pairs.exampleNote');
};
$('#fileBtn').onclick = () => $('#file').click();
$('#file').onchange = async e => { const f = e.target.files[0]; if (f) { $('#edits').value = await f.text(); plain($('#pairsInfo'), f.name); } e.target.value = ''; };
$('#filter').oninput = () => pairs && drawPairs();
$('#pairsCsv').onclick = () => save('epigenesis-scores.csv', toCsv(['rank', 'id', 'family', 'effect', 'word_effect', 'motif_effect', 'direction', 'panel_rank'],
  pairs.rows.map(r => [r.rank, r.id, r.family, r.effect, r.word_effect, r.motif_effect, csvDirection(r.effect), pairs.chosen.get(r.id) ?? ''])), 'text/csv');
$('#pairsReceipt').onclick = () => saveReceipt(pairs.receipt);

window.addEventListener('resize', () => { scan && drawScan(); pairs && drawStrip(); sim.result && drawSim(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { scan && drawScan(); pairs && drawStrip(); sim.result && drawSim(); });

// verify
const ICON = {
  ok: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bad: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>'
};
const withIcon = (node, svg) => { node.innerHTML = svg; return node; };

function renderVerify() {
  const box = $('#verOut');
  box.hidden = !ver; $('#verSteps').hidden = !!ver;
  if (!ver) return;
  const { out } = ver, verdict = el('div', { class: 'verdict' + (out.ok ? '' : ' bad') },
    withIcon(el('span', { class: 'vicon' }), out.ok ? ICON.ok : ICON.bad),
    el('div', {}, el('b', {}, t(out.ok ? 'verify.ok' : 'verify.bad')), el('p', {}, t(out.ok ? 'verify.okSub' : 'verify.badSub'))));
  const list = el('ul', { class: 'checks' }, ...out.checks.map((c, i) => {
    const dot = withIcon(el('span', { class: 'dot' }), c.ok ? ICON.ok : ICON.bad); dot.firstChild.setAttribute('width', 14); dot.firstChild.setAttribute('height', 14);
    return el('li', c.ok ? {} : { class: 'fail' }, dot, t('verify.c.' + i, { tol: out.tolerance }));
  }));
  box.replaceChildren(verdict, list, ...(out.max_abs_difference === null ? [] : [el('p', { class: 'meta', style: 'margin-top:8px' }, t('verify.gap', { d: out.max_abs_difference.toExponential(2) }))]));
}

async function verifyFile(f) {
  plain($('#rname'), f.name); ver = null; renderVerify();
  await guarded($('#rfileBtn'), $('#verErr'), async () => {
    let receipt; try { receipt = JSON.parse(await f.text()); } catch { throw new Fail('err.not_json'); }
    ver = { out: await api('/api/verify', receipt) }; renderVerify();
  });
}
$('#rfileBtn').onclick = () => $('#rfile').click();
$('#rfile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) verifyFile(f); };
const drop = $('#drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) verifyFile(f); };

// open: files found in the folder the command ran in, or imported by hand
let folder = { folder: '', files: [] };
function renderOpen() {
  $('#openFolder').textContent = folder.folder; $('#openNone').hidden = folder.files.length > 0;
  $('#openList').replaceChildren(...folder.files.map(f => {
    const row = el('button', { type: 'button', class: 'file' }, el('b', {}, f.name), el('span', { class: 'kind' }, t('kind.' + f.kind)), el('span', { class: 'meta' }, Math.max(1, Math.round(f.size / 1024)) + ' kB'));
    row.onclick = () => openFolderFile(row, f.name);
    return el('li', {}, row);
  }));
  $('#openCount').hidden = !folder.files.length; $('#openCount').textContent = folder.files.length;
}
function openDoc({ name, text, kind }) {
  if (kind === 'edits') { show('pairs'); $('#edits').value = text; plain($('#pairsInfo'), name); $('#pairsBtn').click(); }
  else if (kind === 'sequence') { show('scan'); $('#seq').value = text; $('#seq').oninput(); $('#scanBtn').click(); }
  else { show('verify'); verifyFile({ name, text: async () => text }); }
}
const openDialog = () => { if (!$('#open').open) $('#open').showModal(); };
const openWork = (button, work) => guarded(button, $('#openErr'), async () => { await work(); $('#open').close(); });
async function openFolderFile(row, name) {
  await openWork(row, async () => openDoc(await api('/api/file?name=' + encodeURIComponent(name))));
  if (!$('#openErr').hidden) openDialog();
}
async function importFile(f) {
  await openWork($('#openImport'), async () => { const text = await f.text(); openDoc({ name: f.name, text, kind: (await api('/api/kind', { name: f.name, text })).kind }); });
  if (!$('#openErr').hidden) openDialog();
}
$('#openBtn').onclick = () => { clearErr($('#openErr')); openDialog(); };
$('#openClose').onclick = () => $('#open').close();
$('#open').onclick = e => { if (e.target === $('#open')) $('#open').close(); };
$('#openImport').onclick = () => $('#openFile').click();
$('#openFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); };
addEventListener('dragover', e => { if (e.dataTransfer?.types.includes('Files')) { e.preventDefault(); $('#dropHint').hidden = false; } });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('#dropHint').hidden = true; });
addEventListener('drop', e => {
  e.preventDefault(); $('#dropHint').hidden = true;
  const f = e.dataTransfer.files[0];
  if (f && !e.target.closest?.('#drop')) importFile(f);
});

// about
function fillAbout() {
  say($('#aboutHow'), 'about.how.p', { n: model.motifs, r: model.radius });
  say($('#aboutCredits'), 'about.credits', { lic: model.motif_source });
  $('#sha').textContent = model.manifest_sha256;
}
$('#aboutBtn').onclick = () => $('#about').showModal();
$('#aboutClose').onclick = () => $('#about').close();
$('#about').onclick = e => { if (e.target === $('#about')) $('#about').close(); };

(async () => {
  applyLang();
  model = await api('/api/model'); fillAbout();
  if (model.simulation) {
    siteTable = await api('/api/site'); sim.protein = siteTable.published.protein; pickSite(siteTable.published.site);
    sim.initial = Object.fromEntries(siteTable.genes.map(g => [g, 0])); buildInitial(); renderSite(); renderPhases();
  } else { $('#simOff').hidden = false; $('#simRun').disabled = true; }
  folder = await api('/api/files'); renderOpen();
  const pre = await api('/api/preload');
  if (pre) openDoc(pre); else if (folder.files.length) openDialog();
})();
</script>
