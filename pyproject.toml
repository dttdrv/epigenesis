[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epigenesis-compiler"
version = "1.7.0"
description = "Universal DNA translation compiler targeting Development Module IR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["genomics", "dna", "cis-regulatory", "compiler", "ga4gh-vrs", "provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/dttdrv/epigenesis"
Repository = "https://github.com/dttdrv/epigenesis"
Issues = "https://github.com/dttdrv/epigenesis/issues"

[project.scripts]
epigenesis = "epigenesis_cli:main"
brainc = "brainc.cli:main"
brainc-validate-bio-chain = "brainc.validator_bio_chain:main"
brainc-validate-genbank = "brainc.validator_insdc:main"
brainc-validate-insdc-graph = "brainc.validator_insdc_graph:main"
brainc-validate-development = "brainc.validator_development:main"
brainc-validate-variants = "brainc.validator_variant:main"

[tool.setuptools]
packages = ["brainc", "brainc.v2"]
py-modules = ["epigenesis_cli"]

[tool.setuptools.package-data]
brainc = ["standards/*.json", "schemas/*.json"]
