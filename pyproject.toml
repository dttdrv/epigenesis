[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epigenesis-compiler"
version = "0.3.0"
description = "A deterministic compiler kernel for DNA-derived state programs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brainc = "brainc.cli:main"

[tool.setuptools]
packages = ["brainc"]
