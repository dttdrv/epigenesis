[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epigenesis-compiler"
version = "1.0.0"
description = "Deterministic DNA compilation to independently verifiable biological state"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
brainc = "brainc.cli:main"
brainc-validate-bio-chain = "brainc.validator_bio_chain:main"
brainc-validate-genbank = "brainc.validator_insdc:main"
brainc-validate-insdc-graph = "brainc.validator_insdc_graph:main"
brainc-validate-development = "brainc.validator_development:main"

[tool.setuptools]
packages = ["brainc", "brainc.v2"]

[tool.setuptools.package-data]
brainc = ["standards/*.json"]
